name: tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-

      # there is no committed composer.lock, so the highest PHPUnit
      # allowed for the current PHP version is installed
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # "bin-dir" is set to "bin" in composer.json
      - name: Run tests
        run: bin/phpunit
